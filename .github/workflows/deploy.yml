name: Deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: rald-design
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy status
        run: |
          echo "ℹ️  Cloudflare Pages deploy step ran (continue-on-error)."
          echo "   If it failed, create the Pages project in the dashboard first:"
          echo "   Pages → New project → Connect rald-design → build: npm run build → dist"
          echo "   Custom domain: design.rald.cloud"

